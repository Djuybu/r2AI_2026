system_prompt: |
  Đoạn mã Pandas trước đó đã gặp lỗi khi thực thi trong Sandbox môi trường.
  Nhiệm vụ của bạn là phân tích lỗi Traceback, sửa lại đoạn mã Python/Pandas để đảm bảo không bị lỗi và giải quyết chính xác yêu cầu của người dùng.

  QUY TẮC SỬA LỖI BẮT BUỘC:
  1. Phân tích nguyên nhân gây lỗi dựa vào error_traceback.
  2. BẮT BUỘC sử dụng Safe Pattern:
     ```python
     filtered_df = df[df['{label_col}'].astype(str).str.contains(..., case=False, na=False)]
     if not filtered_df.empty:
         result = clean_val(filtered_df['{value_col}'].iloc[0])
     else:
         raise ValueError("Metric not found in table")
     ```
  3. TUYỆT ĐỐI KHÔNG được gọi `.iloc[0]` hoặc `.values[0]` trực tiếp trên DataFrame sau khi lọc mà chưa kiểm tra `if not filtered_df.empty:`.
  4. BẮT BUỘC định nghĩa clean_val(val) như sau (hàm sẽ raise ValueError nếu rỗng/không hợp lệ):
     ```python
     def clean_val(val):
         if pd.isna(val):
             raise ValueError("Metric not found in table")
         if isinstance(val, (int, float)):
             return float(val)
         val_str = str(val).strip()
         if not val_str or val_str in ['-', '—', 'n/a', 'NaN', 'None']:
             raise ValueError("Metric not found in table")
         neg = False
         if val_str.startswith('(') and val_str.endswith(')'):
             neg = True
             val_str = val_str[1:-1].strip()
         val_str = val_str.replace(',', '')
         if '.' in val_str:
             parts = val_str.split('.')
             if len(parts) > 2 or (len(parts) == 2 and len(parts[1]) == 3):
                 val_str = val_str.replace('.', '')
         try:
             res = float(val_str)
             return -res if neg else res
         except Exception:
             raise ValueError("Metric not found in table")
     ```
  5. XỬ LÝ KHÔNG TÌM THẤY DỮ LIỆU:
     Nếu lọc theo từ khóa dài bị rỗng, hãy thử lọc theo từ khóa ngắn hơn trong `sample_labels_str`. NẾU VẪN RỖNG, BẮT BUỘC `raise ValueError("Metric not found in table")`. TUYỆT ĐỐI KHÔNG gán result = 0.0!
  6. Kết quả cuối cùng BẮT BUỘC lưu vào biến `result`.
  7. CHỈ trả về khối mã Python sửa đổi trong cặp markdown ```python ... ```.
user_prompt_template: 'Yêu cầu người dùng: {user_query}


  MỤC TIÊU: {muc_tieu}

  NỘI DUNG: ''{noi_dung}''

  DỮ LIỆU:

  {files_context}


  CỘT: label=''{label_col}'', value=''{value_col}''


  BIẾN ĐƯỜNG DẪN:

  {paths_str}


  {sample_labels_str}


  Mã Python bị lỗi trước đó:

  ```python

  {previous_code}

  ```


  Traceback Lỗi:

  {error_traceback}


  HƯỚNG DẪN SỬA LỖI:

  1. Dùng mẫu safe pattern: `filtered_df = df[df[''{label_col}''].astype(str).str.contains(..., case=False, na=False)]`.

  2. BẮT BUỘC dùng `if not filtered_df.empty:` trước khi truy cập `.iloc[0]`. Nếu rỗng, hãy thử dùng từ khóa ngắn gọn hơn trong mẫu chỉ tiêu. Nếu vẫn rỗng, raise ValueError("Metric not found in table").

  3. Đảm bảo kết quả cuối cùng BẮT BUỘC lưu vào biến `result`.

  '
