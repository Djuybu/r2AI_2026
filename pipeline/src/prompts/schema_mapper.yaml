# Schema Mapper prompt — hiện tại không sử dụng LLM.
# File này giữ lại để reference và có thể sử dụng trong tương lai nếu cần.

system_prompt: >
  Schema Mapper hiện sử dụng rule-based matching thay vì LLM.
  Nội dung (noi_dung) nằm ở cột đầu tiên của bảng nên không cần map.
  Chỉ map tiêu chí phụ (tieu_chi_phu) sang tên cột giá trị thực tế.

json_schema: |
  {
    "label_column": "tên cột đầu tiên (chỉ tiêu)",
    "value_column": "tên cột giá trị",
    "all_columns": "danh sách tất cả các cột"
  }
