goal_instructions:
  trich_xuat: "Dùng Multi-Stage Query Pattern trên cột '{label_col}' lấy giá trị ở cột '{value_col}'."
  tinh_tong: "Tìm dòng Tổng/Cộng hoặc cộng các dòng trong phần section."
  so_sanh: "Đọc file từng năm, lấy giá trị và tính phần trăm tăng trưởng."

