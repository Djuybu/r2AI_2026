[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cocopila"
version = "0.1.0"
description = "Pandas Data Agent Pipeline with LangGraph & Self-hosted LLM (Qwen3.5-2B)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "pyyaml>=6.0",
    "json-repair>=0.30.0",
    "python-dotenv>=1.0.0",
    "thefuzz>=0.22.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "deepeval>=1.0.0",
]
kaggle = [
    "vllm>=0.6.0",
    "qdrant-client>=1.9.0",
    "sentence-transformers>=3.0.0",
    "rank-bm25>=0.2.2",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "transformers",
    "huggingface_hub",
]

[tool.setuptools]
packages = ["pipeline.src", "pipeline.src.nodes", "pipeline.src.utils"]
package-dir = {"pipeline.src" = "."}

[tool.setuptools.package-data]
"pipeline.src" = ["prompts/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

